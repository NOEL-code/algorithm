services:
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on:
      - order-service
      - payment-service
      - inventory-service
      - member-service
      - account-service
  member-service:
    build:
      context: .
      args:
        SERVICE: member-service
    ports: ["8083:8083"]
    volumes: ["member-data:/app/data"]
  account-service:
    build:
      context: .
      args:
        SERVICE: account-service
    ports: ["8084:8084"]
    environment:
      MEMBER_SERVICE_URL: http://member-service:8083
    depends_on:
      - member-service
    volumes: ["account-data:/app/data"]
  kafka-volume-init:
    image: apache/kafka:4.1.1
    user: "0:0"
    # 새 named volume의 루트 디렉터리를 Kafka 실행 계정이 쓸 수 있게 한다.
    # root는 이 초기화 명령에만 사용하며 Kafka는 기본 appuser(1000)로 실행한다.
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
  kafka:
    image: apache/kafka:4.1.1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    ports: ["8080:8080"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    volumes: ["order-data:/app/data"]
  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    ports: ["8081:8081"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    volumes: ["payment-data:/app/data"]
  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    ports: ["8082:8082"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    volumes: ["inventory-data:/app/data"]
volumes:
  kafka-data:
  order-data:
  payment-data:
  inventory-data:
  member-data:
  account-data:
