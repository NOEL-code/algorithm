apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-service-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  # 파일 H2 DB와 Outbox 구현은 서비스당 인스턴스 1개를 전제로 한다.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-kafka
          image: apache/kafka:4.1.1
          command:
            - /bin/sh
            - -ec
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" --list; do
                echo "Waiting for Kafka..."
                sleep 5
              done
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: saga-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_HEAP_OPTS
              value: -Xms64m -Xmx128m
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
      containers:
        - name: app
          image: kafka-saga-lab/order-service:local
          imagePullPolicy: IfNotPresent
          workingDir: /app
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: saga-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # TCP 검사는 HTTP 포트 기동 여부를 확인한다. Saga 완료는 API로 확인한다.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: order-service-data
