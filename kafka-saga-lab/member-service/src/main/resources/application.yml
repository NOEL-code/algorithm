# 학습: member 서비스 실행 경계
# 파일 H2는 서비스당 단일 인스턴스용이다. replica만 늘리면 서로 다른 DB로 업무 상태가 갈라질 수 있다.
# 환경 변수로 주소를 주입해 로컬/Compose/Kubernetes에서 같은 코드를 실행한다.
server:
  port: 8083
spring:
  application:
    name: member-service
  datasource:
    url: jdbc:h2:file:./data/member;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:member-schema.sql
lab:
  secure-cookie: ${SECURE_COOKIE:false}
