server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS is resolved per request, including after backend containers restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/orders {
        set $backend order-service:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }
    location /api/payments {
        set $backend payment-service:8081;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }
    location /api/inventory {
        set $backend inventory-service:8082;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }
    location /api/ { return 404; }
    location /api/members {
        set $backend member-service:8083;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }
    location /api/accounts {
        set $backend account-service:8084;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }
    location / { try_files $uri $uri/ /index.html; }
}
