# 학습: 정적 웹과 API 라우팅의 배포 경계
# /api를 제거해 기존 Spring 경로로 전달하고 서비스 이름을 재해석해 컨테이너 교체를 따른다.
# 프록시는 Saga 조정자나 인증 서버가 아니다. 각 서비스가 세션/소유권을 확인한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve service addresses again after backend restarts (Docker or Kubernetes).
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    location /api/orders {
        set $backend order-service:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }
    location /api/payments {
        set $backend payment-service:8081;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }
    location /api/inventory {
        set $backend inventory-service:8082;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }
    location /api/ { return 404; }
    location /api/members {
        set $backend member-service:8083;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }
    location /api/accounts {
        set $backend account-service:8084;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }
    location / { try_files $uri $uri/ /index.html; }
}
